# This workflow builds and publishes the QuReddy CBOM viewer container image.
#
# Multi-platform (linux/amd64 + linux/arm64) is produced WITHOUT QEMU emulation:
# each architecture is built on a native GitHub-hosted runner (ubuntu-latest for
# amd64, ubuntu-24.04-arm for arm64), pushed by digest, and the two per-arch
# digests are stitched into one multi-arch manifest by a final merge job.
#
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build Frontend

concurrency:
  group: cbom-viewer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ "published" ]
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  ORG: "breachsafe"
  IMAGE_NAME: "qureddy-cbom-viewer"

jobs:
  # Architecture-neutral JavaScript validation. The SPA is compiled again inside
  # the container (see Dockerfile.viewer, which builds on $BUILDPLATFORM), so this
  # job exists only to lint and browser-regression the source once, on amd64.
  validate:
    name: Lint and browser regression
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "./frontend"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [21.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        env:
          CBOM_VIEWER_BASE_URL: http://127.0.0.1:8001
          VUE_APP_VIEWER_ONLY: "true"
        run: |
          npm run serve -- --host 127.0.0.1 >"${RUNNER_TEMP}/cbom-viewer.log" 2>&1 &
          viewer_pid=$!
          trap 'kill "${viewer_pid}"' EXIT
          for _ in {1..60}; do
            if curl -fsS "${CBOM_VIEWER_BASE_URL}" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "${CBOM_VIEWER_BASE_URL}" >/dev/null
          npx playwright test tests/cbom-print.spec.js --reporter=line
      - name: Build
        run: npm run build --if-present

  # One native build per architecture. No QEMU: amd64 runs on an amd64 runner,
  # arm64 runs on an arm64 runner. On push/release the image is pushed BY DIGEST
  # and the digest is exported as an artifact for the merge job. On pull_request
  # the same build runs with push disabled as a build-health check.
  build:
    name: Build ${{ matrix.platform }} image
    needs: validate
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Docker Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: "./frontend"
          file: "./frontend/Dockerfile.viewer"
          platforms: ${{ matrix.platform }}
          push: false
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: "./frontend"
          file: "./frontend/Dockerfile.viewer"
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into a single multi-arch manifest and push it
  # under the real tags. Never runs on pull_request (nothing was pushed there).
  merge:
    name: Merge multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${REGISTRY}/${ORG}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${ORG}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
