name: Container Build Policy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  no-emulation:
    name: No emulated container builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Forbid QEMU emulation in container builds
        shell: bash
        run: |
          # Policy: no emulation. Every architecture must be built on a native
          # runner. QEMU-based cross-builds are prohibited. Native multi-arch
          # (for example linux/arm64 on an arm64 runner) is explicitly allowed.
          qemu_action="setup-q""emu-action"
          if grep -R -n -- "$qemu_action" .github/workflows; then
            echo "QEMU emulation is prohibited: build each platform on a native runner." >&2
            exit 1
          fi
          echo "No QEMU emulation found; native multi-arch container builds are allowed."
